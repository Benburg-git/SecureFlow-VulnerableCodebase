
name: DevSecOps Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================================
  # 1. HELLO WORLD
  # ==========================================
  hello-world:
    name: Hello World
    runs-on: ubuntu-latest

    steps:
      - name: Hello World
        run: echo "Hello World from the SecureFlow DevSecOps pipeline!"

  # ==========================================
  # 2. GITLEAKS SECRET SCAN
  # ==========================================
  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        shell: bash
        run: |
          set -euo pipefail

          GITLEAKS_VERSION="8.28.0"

          curl --fail --location --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output gitleaks.tar.gz

          tar -tzf gitleaks.tar.gz >/dev/null
          tar -xzf gitleaks.tar.gz gitleaks

          sudo install gitleaks /usr/local/bin/gitleaks

          gitleaks version

      - name: Run Gitleaks
        shell: bash
        run: |
          set -euo pipefail

          gitleaks detect \
            --source . \
            --log-opts="--all" \
            --config .gitleaks.toml \
            --report-format json \
            --report-path gitleaks-report.json \
            --redact \
            --exit-code 0

          jq -e 'type == "array"' gitleaks-report.json >/dev/null

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: error

  # ==========================================
  # 3. SONARQUBE CLOUD / SAST
  # ==========================================
  sast-scan:
    name: SonarQube Cloud Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=benburg-git
            -Dsonar.projectKey=Benburg-git_SecureFlow-VulnerableCodebase
            -Dsonar.sources=.

      - name: Retrieve SonarQube findings
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: Benburg-git_SecureFlow-VulnerableCodebase
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            --retry 3 \
            -u "${SONAR_TOKEN}:" \
            --get \
            --data-urlencode "componentKeys=${SONAR_PROJECT_KEY}" \
            --data-urlencode "statuses=OPEN,CONFIRMED,REOPENED" \
            --data-urlencode "ps=500" \
            "https://sonarcloud.io/api/issues/search" \
            -o sonar-issues.json

          jq -e '.issues | type == "array"' \
            sonar-issues.json >/dev/null

          jq --arg project "$SONAR_PROJECT_KEY" '{
            project: $project,
            issues: [
              .issues[] | {
                key,
                rule,
                severity,
                type,
                message,
                component,
                line,
                status
              }
            ]
          }' sonar-issues.json > sonar-findings.json

          jq -e '.issues | type == "array"' \
            sonar-findings.json >/dev/null

      - name: Upload SonarQube findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-findings
          path: sonar-findings.json
          if-no-files-found: error

      - name: Summarize SonarQube findings
        shell: bash
        run: |
          set -euo pipefail

          total=$(jq '.issues | length' sonar-findings.json)

          high=$(jq '[
            .issues[] |
            select(
              .severity == "MAJOR" or
              .severity == "CRITICAL" or
              .severity == "BLOCKER"
            )
          ] | length' sonar-findings.json)

          echo "Total SonarQube findings: $total"
          echo "HIGH/CRITICAL AppSec findings: $high"

  # ==========================================
  # 4. TRIVY CONTAINER IMAGE SCAN
  # ==========================================
  image-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build auth-service image
        run: |
          docker build \
            -t auth-service:scan \
            ./services/auth-service

      - name: Build transaction-service image
        run: |
          docker build \
            -t transaction-service:scan \
            ./services/transaction-service

      - name: Build frontend image
        run: |
          docker build \
            -t frontend:scan \
            ./services/frontend

      - name: Scan auth-service image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: auth-service:scan
          format: json
          output: trivy-auth-service.json
          severity: CRITICAL,HIGH
          scanners: vuln
          exit-code: '0'

      - name: Scan transaction-service image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: transaction-service:scan
          format: json
          output: trivy-transaction-service.json
          severity: CRITICAL,HIGH
          scanners: vuln
          exit-code: '0'

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: frontend:scan
          format: json
          output: trivy-frontend.json
          severity: CRITICAL,HIGH
          scanners: vuln
          exit-code: '0'

      - name: Validate Trivy image reports
        shell: bash
        run: |
          set -euo pipefail

          for file in \
            trivy-auth-service.json \
            trivy-transaction-service.json \
            trivy-frontend.json
          do
            test -s "$file"
            jq -e '.Results | type == "array"' "$file" >/dev/null
            echo "Validated: $file"
          done

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-reports
          path: |
            trivy-auth-service.json
            trivy-transaction-service.json
            trivy-frontend.json
          if-no-files-found: error

  # ==========================================
  # 5. INFRASTRUCTURE AS CODE SCAN
  # ==========================================
  iac-scan:
    name: Infrastructure as Code Scan
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Trivy Kubernetes configuration scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra/kubernetes/
          format: json
          output: trivy-k8s-report.json
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Validate Trivy Kubernetes report
        shell: bash
        run: |
          set -euo pipefail

          test -s trivy-k8s-report.json

          jq -e '.Results | type == "array"' \
            trivy-k8s-report.json >/dev/null

      - name: Checkov Terraform scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infra/terraform/
          framework: terraform
          output_format: json
          output_file_path: checkov-report.json
          soft_fail: true

      # Normalise Checkov output if the action created
      # a directory rather than a regular JSON file.
      - name: Normalise Checkov report
        shell: bash
        run: |
          set -euo pipefail

          if [[ -d checkov-report.json ]]; then
            echo "Checkov output is a directory. Locating JSON report."

            candidate=$(find checkov-report.json \
              -type f -name '*.json' -print -quit)

            if [[ -z "$candidate" ]]; then
              echo "::error::No JSON report found inside Checkov output directory."
              exit 1
            fi

            cp "$candidate" checkov-report.json.tmp
            rm -rf checkov-report.json
            mv checkov-report.json.tmp checkov-report.json
          fi

          if [[ ! -f checkov-report.json || ! -s checkov-report.json ]]; then
            echo "::error::Checkov JSON report is missing or empty."
            exit 1
          fi

          jq -e '.results.failed_checks | type == "array"' \
            checkov-report.json >/dev/null

          echo "Checkov report validated successfully."

      - name: Upload IaC reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iac-reports
          path: |
            trivy-k8s-report.json
            checkov-report.json
          if-no-files-found: error

  # ==========================================
  # 6. DIFFERENTIATED SECURITY GATE
  # ==========================================
  security-gate:
    name: Differentiated Security Gate
    runs-on: ubuntu-latest

    needs:
      - secret-scan
      - sast-scan
      - image-scan
      - iac-scan

    if: always()

    steps:
      # ----------------------------------------
      # DOWNLOAD SCAN REPORTS
      # ----------------------------------------

      - name: Download Gitleaks report
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: gitleaks-report
          path: reports/gitleaks

      - name: Download SonarQube findings
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: sonar-findings
          path: reports/sonar

      - name: Download Trivy image reports
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: trivy-image-reports
          path: reports/trivy

      - name: Download IaC reports
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: iac-reports
          path: reports/iac

      # ----------------------------------------
      # DIAGNOSE REPORT STRUCTURE
      # ----------------------------------------

      - name: Inspect downloaded security reports
        if: always()
        shell: bash
        run: |
          echo "========== REPORT STRUCTURE =========="

          if [[ -d reports ]]; then
            find reports -maxdepth 5 -print
          else
            echo "Reports directory does not exist."
          fi

          echo "========== JSON FILES =========="

          find reports -type f -name '*.json' -print 2>/dev/null || true

      # ----------------------------------------
      # ENFORCE SECURITY POLICY
      # ----------------------------------------

      - name: Enforce differentiated security policy
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          fail=0

          echo "========== VALIDATING SECURITY REPORTS =========="

          required=(
            reports/gitleaks/gitleaks-report.json
            reports/sonar/sonar-findings.json
            reports/trivy/trivy-auth-service.json
            reports/trivy/trivy-transaction-service.json
            reports/trivy/trivy-frontend.json
            reports/iac/trivy-k8s-report.json
            reports/iac/checkov-report.json
          )

          # Fail closed if any report is missing,
          # empty, a directory, or invalid JSON.
          for file in "${required[@]}"; do

            if [[ ! -f "$file" || ! -s "$file" ]]; then
              echo "::error::Missing or invalid report: $file"
              exit 1
            fi

            if ! jq empty "$file" >/dev/null 2>&1; then
              echo "::error::Invalid JSON report: $file"
              exit 1
            fi

            echo "VALID: $file"
          done

          echo "All required reports are available."

          # --------------------------------------
          # VALIDATE REPORT SCHEMAS
          # --------------------------------------

          jq -e 'type == "array"' \
            reports/gitleaks/gitleaks-report.json >/dev/null

          jq -e '.issues | type == "array"' \
            reports/sonar/sonar-findings.json >/dev/null

          jq -e '.Results | type == "array"' \
            reports/trivy/trivy-auth-service.json >/dev/null

          jq -e '.Results | type == "array"' \
            reports/trivy/trivy-transaction-service.json >/dev/null

          jq -e '.Results | type == "array"' \
            reports/trivy/trivy-frontend.json >/dev/null

          jq -e '.Results | type == "array"' \
            reports/iac/trivy-k8s-report.json >/dev/null

          jq -e '.results.failed_checks | type == "array"' \
            reports/iac/checkov-report.json >/dev/null

          # --------------------------------------
          # GITLEAKS POLICY
          # --------------------------------------

          secrets=$(jq 'length' \
            reports/gitleaks/gitleaks-report.json)

          # --------------------------------------
          # TRIVY CONTAINER VULNERABILITIES
          # --------------------------------------

          critical_vulns=0

          for file in \
            reports/trivy/trivy-auth-service.json \
            reports/trivy/trivy-transaction-service.json \
            reports/trivy/trivy-frontend.json
          do

            count=$(jq '[
              .Results[]?.Vulnerabilities[]? |
              select(.Severity == "CRITICAL")
            ] | length' "$file")

            critical_vulns=$((critical_vulns + count))

          done

          # --------------------------------------
          # TRIVY KUBERNETES MISCONFIGURATIONS
          # --------------------------------------

          critical_misconfigs=$(jq '[
            .Results[]?.Misconfigurations[]? |
            select(.Severity == "CRITICAL")
          ] | length' \
            reports/iac/trivy-k8s-report.json)

          # --------------------------------------
          # CHECKOV TERRAFORM FINDINGS
          # --------------------------------------

          checkov_failed=$(jq '
            .results.failed_checks | length
          ' reports/iac/checkov-report.json)

          checkov_critical=$(jq '[
            .results.failed_checks[]? |
            select(
              ((.severity // "") | ascii_upcase) == "CRITICAL"
            )
          ] | length' reports/iac/checkov-report.json)

          # --------------------------------------
          # SONARQUBE APPSEC FINDINGS
          # --------------------------------------

          appsec_high=$(jq '[
            .issues[] |
            select(
              .severity == "MAJOR" or
              .severity == "CRITICAL" or
              .severity == "BLOCKER"
            )
          ] | length' reports/sonar/sonar-findings.json)

          # --------------------------------------
          # SECURITY GATE SUMMARY
          # --------------------------------------

          echo ""
          echo "============================================"
          echo "       SECUREFLOW SECURITY GATE"
          echo "============================================"

          echo "Gitleaks exposed secrets: $secrets"

          echo "Trivy CRITICAL vulnerabilities: $critical_vulns"

          echo "Trivy CRITICAL Kubernetes misconfigurations: $critical_misconfigs"

          echo "Checkov failed checks: $checkov_failed"

          echo "Checkov CRITICAL findings: $checkov_critical"

          echo "AppSec HIGH/CRITICAL findings: $appsec_high"

          echo "============================================"

          # --------------------------------------
          # DEVSECOPS ENFORCEMENT
          # --------------------------------------

          if (( secrets > 0 )); then
            echo "::error::DEVSECOPS BLOCKED: Exposed secrets detected."
            fail=1
          fi

          if (( critical_vulns > 0 )); then
            echo "::error::DEVSECOPS BLOCKED: CRITICAL container vulnerabilities detected."
            fail=1
          fi

          if (( critical_misconfigs > 0 )); then
            echo "::error::DEVSECOPS BLOCKED: CRITICAL Kubernetes misconfigurations detected."
            fail=1
          fi

          if (( checkov_critical > 0 )); then
            echo "::error::DEVSECOPS BLOCKED: CRITICAL Terraform findings detected."
            fail=1
          fi

          # --------------------------------------
          # APPSEC ENFORCEMENT
          # --------------------------------------

          if (( appsec_high > 0 )); then
            echo "::error::APPSEC BLOCKED: HIGH/CRITICAL findings detected."
            fail=1
          fi

          # --------------------------------------
          # FINAL DECISION
          # --------------------------------------

          if (( fail > 0 )); then
            echo ""
            echo "SECURITY GATE FAILED."
            echo "Review the security findings before merging."
            exit 1
          fi

          echo ""
          echo "SECURITY GATE PASSED."
          echo "All configured security policies satisfied."
