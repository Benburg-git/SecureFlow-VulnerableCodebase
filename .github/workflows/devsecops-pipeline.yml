name: DevSecOps Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # =========================
  # HELLO WORLD
  # =========================
  hello-world:
    runs-on: ubuntu-latest

    steps:
      - name: Hello World
        run: echo "Hello World from the DevSecOps pipeline!"


  # =========================
  # GITLEAKS SECRET SCAN
  # =========================
  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep '"tag_name"' | cut -d '"' -f4 | sed 's/v//')
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Gitleaks (full history scan)
        run: |
          gitleaks detect \
            --source . \
            --log-opts="--all" \
            --config .gitleaks.toml \
            --report-format json \
            --report-path gitleaks-report.json \
            --redact \
            --exit-code 1

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
# =========================
  # SONARQUBE
  # =========================
  sonarqube:
    name: SonarQube Cloud Scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=benburg-git
            -Dsonar.projectKey=Benburg-git_SecureFlow-VulnerableCodebase
            -Dsonar.sources=.

      - name: Retrieve SonarQube findings
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: Benburg-git_SecureFlow-VulnerableCodebase
        run: |
          curl -sS \
            -u "${SONAR_TOKEN}:" \
            "https://sonarcloud.io/api/issues/search?componentKeys=${SONAR_PROJECT_KEY}&statuses=OPEN,CONFIRMED,REOPENED&ps=500" \
            -o sonar-issues.json

          jq --arg project "$SONAR_PROJECT_KEY" '{
            project: $project,
            issues: [
              .issues[] |
              {
                key: .key,
                rule: .rule,
                severity: .severity,
                type: .type,
                message: .message,
                component: .component,
                line: .line,
                status: .status
              }
            ]
          }' sonar-issues.json > sonar-findings.json

      - name: Upload SonarQube findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-findings
          path: sonar-findings.json

      - name: Enforce SonarQube security gate
        run: |
          critical=$(jq '[.issues[] | select(.severity == "CRITICAL")] | length' sonar-findings.json)
          blocker=$(jq '[.issues[] | select(.severity == "BLOCKER")] | length' sonar-findings.json)

          echo "CRITICAL findings: $critical"
          echo "BLOCKER findings: $blocker"

          if [ "$critical" -gt 0 ] || [ "$blocker" -gt 0 ]; then
            echo "::error::SonarQube security gate FAILED"
            exit 1
          fi

          echo "SonarQube security gate PASSED"
   # =========================
  # TRIVY IMAGE SCAN
  # =========================
  image-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build auth-service image
        run: docker build -t auth-service:scan ./services/auth-service

      - name: Build transaction-service image
        run: docker build -t transaction-service:scan ./services/transaction-service

      - name: Build frontend image
        run: docker build -t frontend:scan ./services/frontend

      - name: Scan auth-service image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: auth-service:scan
          format: json
          output: trivy-auth-service.json
          severity: CRITICAL,HIGH
          scanners: vuln
          exit-code: '0'

      - name: Scan transaction-service image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: transaction-service:scan
          format: json
          output: trivy-transaction-service.json
          severity: CRITICAL,HIGH
          scanners: vuln
          exit-code: '0'

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: frontend:scan
          format: json
          output: trivy-frontend.json
          severity: CRITICAL,HIGH
          scanners: vuln
          exit-code: '0'

      - name: Evaluate hard-fail on CRITICAL/HIGH
        run: |
          TOTAL=0

          for f in trivy-auth-service.json trivy-transaction-service.json trivy-frontend.json; do
            COUNT=$(jq '[.Results[]?.Vulnerabilities[]? |
              select(.Severity=="CRITICAL" or .Severity=="HIGH")] |
              length' "$f")

            echo "$f: $COUNT CRITICAL/HIGH findings"
            TOTAL=$((TOTAL + COUNT))
          done

          echo "Total CRITICAL/HIGH across all images: $TOTAL"

          if [ "$TOTAL" -gt 0 ]; then
            echo "::error::Trivy security gate FAILED - CRITICAL/HIGH vulnerabilities detected."
            exit 1
          fi

          echo "Trivy security gate PASSED"

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-reports
          path: trivy-*.json
          
 
          
  