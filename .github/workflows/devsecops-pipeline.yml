name: DevSecOps Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # =========================
  # HELLO WORLD
  # =========================
  hello-world:
    runs-on: ubuntu-latest
    steps:
      - name: Hello World
        run: echo "Hello World from the DevSecOps pipeline!"

  # =========================
  # GITLEAKS SECRET SCAN
  # =========================
  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep '"tag_name"' | cut -d '"' -f4 | sed 's/v//')
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Gitleaks (report only)
        run: |
          gitleaks detect \
            --source . \
            --log-opts="--all" \
            --config .gitleaks.toml \
            --report-format json \
            --report-path gitleaks-report.json \
            --redact \
            --exit-code 0

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json

  # =========================
  # SONARQUBE / SAST
  # =========================
  sast-scan:
    name: SonarQube Cloud Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=benburg-git
            -Dsonar.projectKey=Benburg-git_SecureFlow-VulnerableCodebase
            -Dsonar.sources=.

      - name: Retrieve SonarQube findings
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: Benburg-git_SecureFlow-VulnerableCodebase
        run: |
          curl -sS \
            -u "${SONAR_TOKEN}:" \
            "https://sonarcloud.io/api/issues/search?componentKeys=${SONAR_PROJECT_KEY}&statuses=OPEN,CONFIRMED,REOPENED&ps=500" \
            -o sonar-issues.json

          jq --arg project "$SONAR_PROJECT_KEY" '{
            project: $project,
            issues: [
              .issues[] |
              {
                key: .key,
                rule: .rule,
                severity: .severity,
                type: .type,
                message: .message,
                component: .component,
                line: .line,
                status: .status
              }
            ]
          }' sonar-issues.json > sonar-findings.json

      - name: Upload SonarQube findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-findings
          path: sonar-findings.json

      - name: Summarize SonarQube findings
        run: |
          total=$(jq '.issues | length' sonar-findings.json)
          high=$(jq '[.issues[] | select(.severity == "MAJOR" or .severity == "CRITICAL" or .severity == "BLOCKER")] | length' sonar-findings.json)
          echo "Total SonarQube findings: $total"
          echo "High-priority AppSec findings: $high"
          echo "SonarQube findings are non-blocking and will be evaluated by the security gate."

  # =========================
  # TRIVY IMAGE SCAN
  # =========================
  image-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build auth-service image
        run: docker build -t auth-service:scan ./services/auth-service

      - name: Build transaction-service image
        run: docker build -t transaction-service:scan ./services/transaction-service

      - name: Build frontend image
        run: docker build -t frontend:scan ./services/frontend

      - name: Scan auth-service image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: auth-service:scan
          format: json
          output: trivy-auth-service.json
          severity: CRITICAL,HIGH
          scanners: vuln
          exit-code: '0'

      - name: Scan transaction-service image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: transaction-service:scan
          format: json
          output: trivy-transaction-service.json
          severity: CRITICAL,HIGH
          scanners: vuln
          exit-code: '0'

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: frontend:scan
          format: json
          output: trivy-frontend.json
          severity: CRITICAL,HIGH
          scanners: vuln
          exit-code: '0'

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-reports
          path: trivy-*.json

  # =========================
  # INFRASTRUCTURE AS CODE SCAN
  # =========================
  iac-scan:
    name: Infrastructure as Code Scan
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Trivy config scan - Kubernetes
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra/kubernetes/
          format: json
          output: trivy-k8s-report.json
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Checkov Terraform scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infra/terraform/
          framework: terraform
          output_format: json
          output_file_path: checkov-report.json
          soft_fail: true

      - name: Upload IaC reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iac-reports
          path: |
            trivy-k8s-report.json
            checkov-report.json

  # =========================
# DIFFERENTIATED SECURITY GATE
# =========================
security-gate:
  name: Security Gate
  runs-on: ubuntu-latest
  if: always()

  needs:
    - secret-scan
    - sast-scan
    - image-scan
    - iac-scan

  permissions:
    contents: read
    pull-requests: write
    issues: write

  steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Download all security artifacts
      uses: actions/download-artifact@v5
      with:
        path: security-artifacts

    - name: Display downloaded reports
      run: |
        find security-artifacts -maxdepth 3 -type f -print

    - name: Run differentiated security gate
      id: security_gate
      shell: bash
      run: |
        set -euo pipefail

        DEVSECOPS_BLOCKERS=0
        APPSEC_FINDINGS=0

        echo "Evaluating DevSecOps-owned findings..."

        # ---------------------------------
        # GITLEAKS
        # Any detected secret is blocking.
        # Missing report also blocks.
        # ---------------------------------
        GITLEAKS_REPORT=$(find security-artifacts \
          -name "gitleaks-report.json" \
          | head -1 || true)

        if [ -z "${GITLEAKS_REPORT}" ]; then
          echo "::error::Gitleaks report missing. Failing closed."
          DEVSECOPS_BLOCKERS=$((DEVSECOPS_BLOCKERS + 1))
        else
          GITLEAKS_COUNT=$(jq 'length' "$GITLEAKS_REPORT")

          echo "Gitleaks findings: $GITLEAKS_COUNT"

          if [ "$GITLEAKS_COUNT" -gt 0 ]; then
            DEVSECOPS_BLOCKERS=$((DEVSECOPS_BLOCKERS + GITLEAKS_COUNT))
          fi
        fi

        # ---------------------------------
        # TRIVY IMAGE REPORTS
        # Block only CRITICAL findings.
        # ---------------------------------
        TRIVY_REPORT_COUNT=0

        while IFS= read -r f; do
          [ -z "$f" ] && continue

          TRIVY_REPORT_COUNT=$((TRIVY_REPORT_COUNT + 1))

          CRITICAL_COUNT=$(jq '
            [
              .Results[]? |
              (
                (.Vulnerabilities[]? |
                  select(.Severity == "CRITICAL")),
                (.Misconfigurations[]? |
                  select(.Severity == "CRITICAL"))
              )
            ] | length
          ' "$f")

          echo "$f CRITICAL findings: $CRITICAL_COUNT"

          DEVSECOPS_BLOCKERS=$((DEVSECOPS_BLOCKERS + CRITICAL_COUNT))

        done < <(
          find security-artifacts \
            -name "trivy-*.json" \
            ! -name "trivy-k8s-report.json"
        )

        if [ "$TRIVY_REPORT_COUNT" -eq 0 ]; then
          echo "::error::No Trivy image reports found. Failing closed."
          DEVSECOPS_BLOCKERS=$((DEVSECOPS_BLOCKERS + 1))
        fi

        # ---------------------------------
        # KUBERNETES / IAC TRIVY REPORT
        # CRITICAL findings are blocking.
        # ---------------------------------
        K8S_REPORT=$(find security-artifacts \
          -name "trivy-k8s-report.json" \
          | head -1 || true)

        if [ -z "${K8S_REPORT}" ]; then
          echo "::error::Kubernetes Trivy report missing. Failing closed."
          DEVSECOPS_BLOCKERS=$((DEVSECOPS_BLOCKERS + 1))
        else
          K8S_CRITICAL=$(jq '
            [
              .Results[]? |
              (
                (.Vulnerabilities[]? |
                  select(.Severity == "CRITICAL")),
                (.Misconfigurations[]? |
                  select(.Severity == "CRITICAL"))
              )
            ] | length
          ' "$K8S_REPORT")

          echo "K8s CRITICAL findings: $K8S_CRITICAL"

          DEVSECOPS_BLOCKERS=$((DEVSECOPS_BLOCKERS + K8S_CRITICAL))
        fi

        # ---------------------------------
        # SONARQUBE / APPSEC
        # Non-blocking.
        # ---------------------------------
        SONAR_REPORT=$(find security-artifacts \
          -name "sonar-findings.json" \
          | head -1 || true)

        if [ -n "${SONAR_REPORT}" ]; then
          APPSEC_FINDINGS=$(jq '
            [
              .issues[]
              | select(
                  .severity == "MAJOR"
                  or .severity == "CRITICAL"
                  or .severity == "BLOCKER"
                )
            ] | length
          ' "$SONAR_REPORT")

          echo "AppSec findings: $APPSEC_FINDINGS"
        else
          echo "::warning::SonarQube report missing."
          echo "::warning::AppSec findings cannot be summarized."
        fi

        # ---------------------------------
        # EXPORT RESULTS
        # ---------------------------------
        echo "DEVSECOPS_BLOCKERS=$DEVSECOPS_BLOCKERS" >> "$GITHUB_ENV"
        echo "APPSEC_FINDINGS=$APPSEC_FINDINGS" >> "$GITHUB_ENV"

        # ---------------------------------
        # FINAL GATE DECISION
        # ---------------------------------
        if [ "$DEVSECOPS_BLOCKERS" -gt 0 ]; then
          echo "SECURITY_GATE_RESULT=BLOCKED" >> "$GITHUB_ENV"
        else
          echo "SECURITY_GATE_RESULT=PASSED" >> "$GITHUB_ENV"
        fi

    - name: Generate PR security summary
      if: github.event_name == 'pull_request'
      shell: bash
      run: |
        cat > security-gate-summary.md <<EOF
        ## 🛡️ SecureFlow Security Gate

        ### DevSecOps-owned findings

        **Blocking findings:** ${DEVSECOPS_BLOCKERS}

        - Confirmed secret finding → ⛔ BLOCKING
        - CRITICAL image vulnerability → ⛔ BLOCKING
        - CRITICAL IaC/Kubernetes finding → ⛔ BLOCKING
        - Missing required DevSecOps scanner report → ⛔ BLOCKING
        - HIGH / MEDIUM / LOW → review but non-blocking unless escalated

        ### AppSec-owned findings

        **High-priority AppSec findings:** ${APPSEC_FINDINGS}

        SonarQube/AppSec findings are **non-blocking**.

        Findings must be handed to AppSec for triage.

        AppSec intake:

        \`docs/security-gate-policy.md#appsec-intake-template\`

        ### Final Gate Decision

        **${SECURITY_GATE_RESULT}**
        EOF

    - name: Post security gate PR comment
      if: github.event_name == 'pull_request'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh pr comment "${{ github.event.pull_request.number }}" \
          --repo "${{ github.repository }}" \
          --body-file security-gate-summary.md

    - name: Upload security gate summary
      if: always() && github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: security-gate-summary
        path: security-gate-summary.md

    - name: Enforce final gate decision
      run: |
        if [ "${SECURITY_GATE_RESULT}" = "BLOCKED" ]; then
          echo "::error::Security Gate FAILED - blocking DevSecOps findings are present."
          exit 1
        fi

        echo "Security Gate PASSED"