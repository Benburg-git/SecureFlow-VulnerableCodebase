
name: DevSecOps Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ==========================================
  # HELLO WORLD
  # ==========================================
  hello-world:
    runs-on: ubuntu-latest
    steps:
      - name: Hello World
        run: echo "Hello World from the DevSecOps pipeline!"

  # ==========================================
  # GITLEAKS SECRET SCAN
  # ==========================================
  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.28.0"

          curl --fail --location --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output gitleaks.tar.gz

          tar -tzf gitleaks.tar.gz >/dev/null
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Gitleaks (report only)
        shell: bash
        run: |
          gitleaks detect \
            --source . \
            --log-opts="--all" \
            --config .gitleaks.toml \
            --report-format json \
            --report-path gitleaks-report.json \
            --redact \
            --exit-code 0

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: error

  # ==========================================
  # SONARQUBE / SAST
  # ==========================================
  sast-scan:
    name: SonarQube Cloud Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=benburg-git
            -Dsonar.projectKey=Benburg-git_SecureFlow-VulnerableCodebase
            -Dsonar.sources=.

      - name: Retrieve SonarQube findings
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: Benburg-git_SecureFlow-VulnerableCodebase
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            --retry 3 \
            -u "${SONAR_TOKEN}:" \
            --get \
            --data-urlencode "componentKeys=${SONAR_PROJECT_KEY}" \
            --data-urlencode "statuses=OPEN,CONFIRMED,REOPENED" \
            --data-urlencode "ps=500" \
            "https://sonarcloud.io/api/issues/search" \
            -o sonar-issues.json

          jq -e '.issues | type == "array"' sonar-issues.json >/dev/null

          jq --arg project "$SONAR_PROJECT_KEY" '{
            project: $project,
            issues: [
              .issues[] | {
                key,
                rule,
                severity,
                type,
                message,
                component,
                line,
                status
              }
            ]
          }' sonar-issues.json > sonar-findings.json

      - name: Upload SonarQube findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-findings
          path: sonar-findings.json
          if-no-files-found: warn

      - name: Summarize SonarQube findings
        shell: bash
        run: |
          total=$(jq '.issues | length' sonar-findings.json)
          high=$(jq '[
            .issues[] |
            select(
              .severity == "MAJOR" or
              .severity == "CRITICAL" or
              .severity == "BLOCKER"
            )
          ] | length' sonar-findings.json)

          echo "Total SonarQube findings: $total"
          echo "High-priority AppSec findings: $high"
          echo "AppSec findings are non-blocking."

  # ==========================================
  # TRIVY IMAGE SCAN
  # ==========================================
  image-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build auth-service image
        run: docker build -t auth-service:scan ./services/auth-service

      - name: Build transaction-service image
        run: docker build -t transaction-service:scan ./services/transaction-service

      - name: Build frontend image
        run: docker build -t frontend:scan ./services/frontend

      - name: Scan auth-service image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: auth-service:scan
          format: json
          output: trivy-auth-service.json
          severity: CRITICAL,HIGH
          scanners: vuln
          exit-code: '0'

      - name: Scan transaction-service image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: transaction-service:scan
          format: json
          output: trivy-transaction-service.json
          severity: CRITICAL,HIGH
          scanners: vuln
          exit-code: '0'

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: frontend:scan
          format: json
          output: trivy-frontend.json
          severity: CRITICAL,HIGH
          scanners: vuln
          exit-code: '0'

      # Explicit paths prevent obsolete tracked reports
      # from being included in current scan artifacts.
      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-reports
          path: |
            trivy-auth-service.json
            trivy-transaction-service.json
            trivy-frontend.json
          if-no-files-found: error

  # ==========================================
  # INFRASTRUCTURE AS CODE SCAN
  # ==========================================
  iac-scan:
    name: Infrastructure as Code Scan
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Trivy config scan - Kubernetes
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra/kubernetes/
          format: json
          output: trivy-k8s-report.json
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Checkov Terraform scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infra/terraform/
          framework: terraform
          output_format: json
          output_file_path: checkov-report.json
          soft_fail: true

      - name: Upload IaC reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iac-reports
          path: |
            trivy-k8s-report.json
            checkov-report.json
          if-no-files-found: error

  # ==========================================
  # DIFFERENTIATED SECURITY GATE
  # ==========================================
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    if: always()

    needs:
      - secret-scan
      - sast-scan
      - image-scan
      - iac-scan

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download all security artifacts
        uses: actions/download-artifact@v5
        with:
          path: security-artifacts

      - name: Display downloaded reports
        run: |
          find security-artifacts -maxdepth 3 -type f -print

      - name: Run differentiated security gate
        id: security_gate
        shell: bash
        run: |
          set -euo pipefail

          DEVSECOPS_BLOCKERS=0
          APPSEC_FINDINGS=0

          echo "Evaluating DevSecOps-owned findings..."

          # ----------------------------------
          # GITLEAKS
          # ----------------------------------
          GITLEAKS_REPORT="security-artifacts/gitleaks-report/gitleaks-report.json"

          if [ ! -f "$GITLEAKS_REPORT" ]; then
            echo "::error::Gitleaks report missing."
            DEVSECOPS_BLOCKERS=$((DEVSECOPS_BLOCKERS + 1))
          elif ! jq -e 'type == "array"' "$GITLEAKS_REPORT" >/dev/null; then
            echo "::error::Invalid Gitleaks report."
            DEVSECOPS_BLOCKERS=$((DEVSECOPS_BLOCKERS + 1))
          else
            GITLEAKS_COUNT=$(jq 'length' "$GITLEAKS_REPORT")
            echo "Gitleaks findings: $GITLEAKS_COUNT"
            DEVSECOPS_BLOCKERS=$((DEVSECOPS_BLOCKERS + GITLEAKS_COUNT))
          fi

          # ----------------------------------
          # TRIVY IMAGE REPORTS
          # ----------------------------------
          IMAGE_REPORT_DIR="security-artifacts/trivy-image-reports"

          for service in auth-service transaction-service frontend; do
            report="${IMAGE_REPORT_DIR}/trivy-${service}.json"

            if [ ! -f "$report" ]; then
              echo "::error::Missing Trivy report: $report"
              DEVSECOPS_BLOCKERS=$((DEVSECOPS_BLOCKERS + 1))
              continue
            fi

            if ! jq -e '.Results | type == "array"' "$report" >/dev/null; then
              echo "::error::Invalid Trivy report: $report"
              DEVSECOPS_BLOCKERS=$((DEVSECOPS_BLOCKERS + 1))
              continue
            fi

            CRITICAL_COUNT=$(jq '[
              .Results[]? |
              .Vulnerabilities[]? |
              select(.Severity == "CRITICAL")
            ] | length' "$report")

            echo "$service CRITICAL findings: $CRITICAL_COUNT"

            DEVSECOPS_BLOCKERS=$((DEVSECOPS_BLOCKERS + CRITICAL_COUNT))
          done

          # ----------------------------------
          # KUBERNETES / IAC TRIVY REPORT
          # ----------------------------------
          K8S_REPORT="security-artifacts/iac-reports/trivy-k8s-report.json"

          if [ ! -f "$K8S_REPORT" ]; then
            echo "::error::Kubernetes Trivy report missing."
            DEVSECOPS_BLOCKERS=$((DEVSECOPS_BLOCKERS + 1))
          elif ! jq -e '.Results | type == "array"' "$K8S_REPORT" >/dev/null; then
            echo "::error::Invalid Kubernetes Trivy report."
            DEVSECOPS_BLOCKERS=$((DEVSECOPS_BLOCKERS + 1))
          else
            K8S_CRITICAL=$(jq '[
              .Results[]? |
              .Misconfigurations[]? |
              select(.Severity == "CRITICAL")
            ] | length' "$K8S_REPORT")

            echo "K8s CRITICAL findings: $K8S_CRITICAL"

            DEVSECOPS_BLOCKERS=$((DEVSECOPS_BLOCKERS + K8S_CRITICAL))
          fi

          # ----------------------------------
          # SONARQUBE / APPSEC
          # NON-BLOCKING FINDINGS
          # ----------------------------------
          SONAR_REPORT="security-artifacts/sonar-findings/sonar-findings.json"

          if [ -f "$SONAR_REPORT" ]; then
            if jq -e '.issues | type == "array"' "$SONAR_REPORT" >/dev/null; then
              APPSEC_FINDINGS=$(jq '[
                .issues[] |
                select(
                  .severity == "MAJOR" or
                  .severity == "CRITICAL" or
                  .severity == "BLOCKER"
                )
              ] | length' "$SONAR_REPORT")
              echo "AppSec findings: $APPSEC_FINDINGS"
            else
              echo "::warning::Invalid SonarQube report."
            fi
          else
            echo "::warning::SonarQube report missing."
          fi

          # ----------------------------------
          # EXPORT RESULTS
          # ----------------------------------
          echo "DEVSECOPS_BLOCKERS=$DEVSECOPS_BLOCKERS" >> "$GITHUB_ENV"
          echo "APPSEC_FINDINGS=$APPSEC_FINDINGS" >> "$GITHUB_ENV"

          # ----------------------------------
          # FINAL GATE DECISION
          # ----------------------------------
          if [ "$DEVSECOPS_BLOCKERS" -gt 0 ]; then
            echo "SECURITY_GATE_RESULT=BLOCKED" >> "$GITHUB_ENV"
            echo "Security Gate: BLOCKED ($DEVSECOPS_BLOCKERS blockers)"
          else
            echo "SECURITY_GATE_RESULT=PASSED" >> "$GITHUB_ENV"
            echo "Security Gate: PASSED"
          fi

      - name: Generate PR security summary
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          cat > security-gate-summary.md <<EOF
          ## SecureFlow Security Gate

          ### DevSecOps-owned findings

          **Blocking findings:** ${DEVSECOPS_BLOCKERS}

          - Confirmed secret finding: BLOCKING
          - CRITICAL image vulnerability: BLOCKING
          - CRITICAL Kubernetes/IaC finding: BLOCKING
          - Missing or invalid required report: BLOCKING
          - HIGH / MEDIUM / LOW: review unless escalated

          ### AppSec-owned findings

          **High-priority AppSec findings:** ${APPSEC_FINDINGS}

          SonarQube/AppSec findings are non-blocking.
          Findings must be handed to AppSec for triage.

          AppSec intake:
          docs/security-gate-policy.md#appsec-intake-template

          ### Final Gate Decision

          **${SECURITY_GATE_RESULT}**
          EOF

      - name: Post security gate PR comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body-file security-gate-summary.md

      - name: Upload security gate summary
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: security-gate-summary
          path: security-gate-summary.md
          if-no-files-found: warn

      - name: Enforce final gate decision
        shell: bash
        run: |
          if [ "${SECURITY_GATE_RESULT}" != "PASSED" ]; then
            echo "::error::Security Gate FAILED - blocking findings are present."
            exit 1
          fi

          echo "Security Gate PASSED"

  # ==========================================
  # SUPPLY CHAIN SECURITY
  # GHCR + COSIGN
  # ==========================================
  publish-and-sign:
    name: Publish and Sign Images
    runs-on: ubuntu-latest
    needs: security-gate

    # Only publish on a successful main-branch push.
    # Never publish images from pull requests.
    if: >-
      ${{
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        needs.security-gate.result == 'success'
      }}

    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      matrix:
        include:
          - service: auth-service
            context: ./services/auth-service
          - service: transaction-service
            context: ./services/transaction-service
          - service: frontend
            context: ./services/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set image name
        shell: bash
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/secureflow-${{ matrix.service }}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Verify Cosign signature
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          cosign verify \
            --certificate-identity-regexp="^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/devsecops-pipeline.yml@" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"

      - name: Display immutable image reference
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          echo "Signed image:"
          echo "${IMAGE}@${DIGEST}"
          echo "IMAGE_${{ matrix.service }}=${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
