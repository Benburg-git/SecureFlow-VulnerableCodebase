
name: DevSecOps Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ==========================================
  # HELLO WORLD
  # ==========================================
  hello-world:
    runs-on: ubuntu-latest
    steps:
      - name: Hello World
        run: echo "Hello World from the DevSecOps pipeline!"

  # ==========================================
  # GITLEAKS SECRET SCAN
  # ==========================================
  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.28.0"

          curl --fail --location --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output gitleaks.tar.gz

          tar -tzf gitleaks.tar.gz >/dev/null
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Gitleaks (report only)
        shell: bash
        run: |
          gitleaks detect \
            --source . \
            --log-opts="--all" \
            --config .gitleaks.toml \
            --report-format json \
            --report-path gitleaks-report.json \
            --redact \
            --exit-code 0

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: error

  # ==========================================
  # SONARQUBE / SAST
  # ==========================================
  sast-scan:
    name: SonarQube Cloud Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=benburg-git
            -Dsonar.projectKey=Benburg-git_SecureFlow-VulnerableCodebase
            -Dsonar.sources=.

      - name: Retrieve SonarQube findings
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: Benburg-git_SecureFlow-VulnerableCodebase
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            --retry 3 \
            -u "${SONAR_TOKEN}:" \
            --get \
            --data-urlencode "componentKeys=${SONAR_PROJECT_KEY}" \
            --data-urlencode "statuses=OPEN,CONFIRMED,REOPENED" \
            --data-urlencode "ps=500" \
            "https://sonarcloud.io/api/issues/search" \
            -o sonar-issues.json

          jq -e '.issues | type == "array"' sonar-issues.json >/dev/null

          jq --arg project "$SONAR_PROJECT_KEY" '{
            project: $project,
            issues: [
              .issues[] | {
                key,
                rule,
                severity,
                type,
                message,
                component,
                line,
                status
              }
            ]
          }' sonar-issues.json > sonar-findings.json

      - name: Upload SonarQube findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-findings
          path: sonar-findings.json
          if-no-files-found: warn

      - name: Summarize SonarQube findings
        shell: bash
        run: |
          total=$(jq '.issues | length' sonar-findings.json)
          high=$(jq '[
            .issues[] |
            select(
              .severity == "MAJOR" or
              .severity == "CRITICAL" or
              .severity == "BLOCKER"
            )
          ] | length' sonar-findings.json)

          echo "Total SonarQube findings: $total"
          echo "High-priority AppSec findings: $high"
          echo "AppSec findings are non-blocking."

  # ==========================================
  # TRIVY IMAGE SCAN
  # ==========================================
  image-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build auth-service image
        run: docker build -t auth-service:scan ./services/auth-service

      - name: Build transaction-service image
        run: docker build -t transaction-service:scan ./services/transaction-service

      - name: Build frontend image
        run: docker build -t frontend:scan ./services/frontend

      - name: Scan auth-service image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: auth-service:scan
          format: json
          output: trivy-auth-service.json
          severity: CRITICAL,HIGH
          scanners: vuln
          exit-code: '0'

      - name: Scan transaction-service image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: transaction-service:scan
          format: json
          output: trivy-transaction-service.json
          severity: CRITICAL,HIGH
          scanners: vuln
          exit-code: '0'

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: frontend:scan
          format: json
          output: trivy-frontend.json
          severity: CRITICAL,HIGH
          scanners: vuln
          exit-code: '0'

      # Explicit paths prevent obsolete tracked reports
      # from being included in current scan artifacts.
      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-reports
          path: |
            trivy-auth-service.json
            trivy-transaction-service.json
            trivy-frontend.json
          if-no-files-found: error

  # ==========================================
  # INFRASTRUCTURE AS CODE SCAN
  # ==========================================
  iac-scan:
    name: Infrastructure as Code Scan
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Trivy config scan - Kubernetes
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra/kubernetes/
          format: json
          output: trivy-k8s-report.json
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Checkov Terraform scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infra/terraform/
          framework: terraform
          output_format: json
          output_file_path: checkov-report.json
          soft_fail: true

      - name: Upload IaC reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iac-reports
          path: |
            trivy-k8s-report.json
            checkov-report.json
          if-no-files-found: error

  
  # ==========================================
  # DIFFERENTIATED SECURITY GATE
  # ==========================================
  security-gate:
    name: Differentiated Security Gate
    runs-on: ubuntu-latest

    needs:
      - secret-scan
      - sast-scan
      - image-scan
      - iac-scan

    if: always()

    steps:
      - name: Download Gitleaks report
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: gitleaks-report
          path: reports/gitleaks

      - name: Download SonarQube findings
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: sonar-findings
          path: reports/sonar

      - name: Download Trivy reports
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: trivy-image-reports
          path: reports/trivy

      - name: Download IaC reports
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: iac-reports
          path: reports/iac

      - name: Enforce differentiated security policy
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          fail=0

          # Fail closed when required reports are missing.
          required=(
            reports/gitleaks/gitleaks-report.json
            reports/sonar/sonar-findings.json
            reports/trivy/trivy-auth-service.json
            reports/trivy/trivy-transaction-service.json
            reports/trivy/trivy-frontend.json
            reports/iac/trivy-k8s-report.json
            reports/iac/checkov-report.json
          )

          for file in "${required[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Required security report missing: $file"
              fail=1
            fi
          done

          if [[ "$fail" -ne 0 ]]; then
            exit 1
          fi

          # Gitleaks: any secret blocks.
          secrets=$(jq 'length' reports/gitleaks/gitleaks-report.json)

          # Trivy: count CRITICAL vulnerabilities.
          critical=0

          for file in reports/trivy/*.json reports/iac/trivy-k8s-report.json; do
            count=$(jq '[
              .Results[]?.Vulnerabilities[]? |
              select(.Severity == "CRITICAL")
            ] | length' "$file")
            critical=$((critical + count))
          done

          # Checkov: count CRITICAL IaC findings.
          checkov_critical=$(jq '[
            .results.failed_checks[]? |
            select((.severity // "" | ascii_upcase) == "CRITICAL")
          ] | length' reports/iac/checkov-report.json)

          # SonarQube: MAJOR is treated as HIGH by our policy.
          appsec_high=$(jq '[
            .issues[]? |
            select(
              .severity == "MAJOR" or
              .severity == "CRITICAL" or
              .severity == "BLOCKER"
            )
          ] | length' reports/sonar/sonar-findings.json)

          echo "========== SECURITY GATE SUMMARY =========="
          echo "Gitleaks secrets: $secrets"
          echo "Trivy CRITICAL: $critical"
          echo "Checkov CRITICAL: $checkov_critical"
          echo "AppSec HIGH/CRITICAL: $appsec_high"
          echo "============================================"

          # DevSecOps enforcement.
          if (( secrets > 0 )); then
            echo "::error::DevSecOps BLOCKED: exposed secrets detected."
            fail=1
          fi

          if (( critical > 0 )); then
            echo "::error::DevSecOps BLOCKED: CRITICAL vulnerabilities detected."
            fail=1
          fi

          if (( checkov_critical > 0 )); then
            echo "::error::DevSecOps BLOCKED: CRITICAL IaC findings detected."
            fail=1
          fi

          # AppSec enforcement.
          if (( appsec_high > 0 )); then
            echo "::error::AppSec BLOCKED: HIGH/CRITICAL findings detected."
            fail=1
          fi

          if (( fail > 0 )); then
            echo "Security policy FAILED."
            exit 1
          fi

          echo "Security policy PASSED."
