name: SonarQube Cloud Scan

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  sonarqube:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=Benburg-git
            -Dsonar.projectKey=Benburg-git_SecureFlow-VulnerableCodebase
            -Dsonar.sources=.

      - name: Retrieve SonarQube findings
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: Benburg-git_SecureFlow-VulnerableCodebase
        run: |
          curl -sS \
            -u "${SONAR_TOKEN}:" \
            "https://sonarcloud.io/api/issues/search?componentKeys=${SONAR_PROJECT_KEY}&statuses=OPEN,CONFIRMED,REOPENED&ps=500" \
            -o sonar-issues.json

          jq --arg project "$SONAR_PROJECT_KEY" '{
            project: $project,
            issues: [
              .issues[] |
              {
                key: .key,
                rule: .rule,
                severity: .severity,
                type: .type,
                message: .message,
                component: .component,
                line: .line,
                status: .status
              }
            ]
          }' sonar-issues.json > sonar-findings.json

      - name: Upload SonarQube findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-findings
          path: sonar-findings.json

      - name: Enforce SonarQube security gate
        run: |
          critical=$(jq '[.issues[] | select(.severity == "CRITICAL")] | length' sonar-findings.json)
          blocker=$(jq '[.issues[] | select(.severity == "BLOCKER")] | length' sonar-findings.json)

          echo "CRITICAL findings: $critical"
          echo "BLOCKER findings: $blocker"

          if [ "$critical" -gt 0 ] || [ "$blocker" -gt 0 ]; then
            echo "::error::SonarQube security gate FAILED"
            exit 1
          fi

          echo "SonarQube security gate PASSED"