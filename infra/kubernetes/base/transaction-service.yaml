apiVersion: apps/v1
kind: Deployment

metadata:
  name: transaction-service
  namespace: secureflow

spec:
  replicas: 1

  selector:
    matchLabels:
      app: transaction-service

  template:
    metadata:
      labels:
        app: transaction-service

      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "transaction-service"
        vault.hashicorp.com/agent-inject-secret-config: "secureflow/data/transaction-service"

        vault.hashicorp.com/agent-inject-template-config: |
          {{- with secret "secureflow/data/transaction-service" -}}
          export DB_HOST="{{ .Data.data.DB_HOST }}"
          export DB_PORT="{{ .Data.data.DB_PORT }}"
          export DB_NAME="{{ .Data.data.DB_NAME }}"
          export DB_USER="{{ .Data.data.DB_USER }}"
          export DB_PASSWORD="{{ .Data.data.DB_PASSWORD }}"
          {{- end }}

    spec:
      serviceAccountName: transaction-service-sa

      containers:
        - name: transaction-service
          image: secureflow/transaction-service:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 5002

          command:
            - /bin/sh
            - -c

          args:
            - |
              . /vault/secrets/config
              exec python app.py

          envFrom:
            - configMapRef:
                name: secureflow-config

          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL

---

apiVersion: v1
kind: Service

metadata:
  name: transaction-service
  namespace: secureflow

spec:
  selector:
    app: transaction-service

  ports:
    - port: 5002
      targetPort: 5002