apiVersion: apps/v1
kind: Deployment

metadata:
  name: auth-service
  namespace: secureflow

spec:
  replicas: 1

  selector:
    matchLabels:
      app: auth-service

  template:
    metadata:
      labels:
        app: auth-service

      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "auth-service-role"
        vault.hashicorp.com/agent-inject-secret-config: "secureflow/data/auth-service"

        vault.hashicorp.com/agent-inject-template-config: |
          {{- with secret "secureflow/data/auth-service" -}}
          export SECRET_KEY="{{ .Data.data.SECRET_KEY }}"
          export DB_HOST="{{ .Data.data.DB_HOST }}"
          export DB_PORT="{{ .Data.data.DB_PORT }}"
          export DB_NAME="{{ .Data.data.DB_NAME }}"
          export DB_USER="{{ .Data.data.DB_USER }}"
          export DB_PASSWORD="{{ .Data.data.DB_PASSWORD }}"
          {{- end }}

    spec:
      serviceAccountName: auth-service-sa

      containers:
        - name: auth-service
          image: secureflow/auth-service:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 5001

          command:
            - /bin/sh
            - -c

          args:
            - |
              . /vault/secrets/config
              exec python app.py

          envFrom:
            - configMapRef:
                name: secureflow-config

          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            runAsUser: 0

---

apiVersion: v1
kind: Service

metadata:
  name: auth-service
  namespace: secureflow

spec:
  selector:
    app: auth-service

  ports:
    - port: 5001
      targetPort: 5001